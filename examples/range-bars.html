<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Bars Preview</title>
</head>
<body>

    <!-- ============================================================
         FEEL  (horizontal range bars)
         Each bar = one content-block snippet. All values & colours
         are set here in the HTML via data-* attributes; rendering is
         done by the shared external script (patrik-components.js).
         ============================================================ -->
    <div style="background-color:#efefef; padding:24px; border-radius:10px; font-family:sans-serif; max-width:550px; margin:30px auto;">

        <h2 style="color:#1a3a4a; margin-top:0; font-size:22px;">Feel</h2>

        <div class="patrik-range-bar"
             data-title="Power delivery"
             data-left="Direct"
             data-right="Smooth"
             data-min="25"
             data-max="62">
        </div>

        <div class="patrik-range-bar"
             data-title="Center of effort"
             data-left="Backhanded"
             data-right="Fronthanded"
             data-min="45"
             data-max="80">
        </div>

    </div>


    <!-- ============================================================
         RIDER GOALS  (scale bars with stops + highlighted range)
         ============================================================ -->
    <div style="background-color:#efefef; padding:24px; border-radius:10px; font-family:sans-serif; max-width:550px; margin:30px auto;">

        <h2 style="color:#1a3a4a; margin-top:0; font-size:22px;">Rider goals</h2>

        <!-- Rider level: 4 evenly spaced stops; band spans stop 1..3 -->
        <div class="patrik-range-bar"
             data-title="Rider level"
             data-scale="Entry,Intermediate,Advanced,Pro"
             data-scale-index="true"
             data-min="1"
             data-max="3">
        </div>

        <!-- Rider goals: 3 stops; band spans stop 1..2 -->
        <div class="patrik-range-bar"
             data-title="Riding goal"
             data-scale="Easy going,Advancing,Pure performance"
             data-scale-index="true"
             data-min="1"
             data-max="2">
        </div>

        <!-- Example with a custom colour + single-value marker -->
        <div class="patrik-range-bar"
             data-title="Comfort zone"
             data-left="Relaxed"
             data-right="Aggressive"
             data-min="10"
             data-max="90"
             data-range="#ffd166">
        </div>

    </div>

    <!-- External rendering script (shared across pages) -->
    <script src="../patrik-components.js"></script>

</body>
</html>
